name: vocal_lens
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.1+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.0.2
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  google_fonts: ^6.2.1
  google_mlkit_text_recognition: ^0.13.0
  http: ^1.2.1
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpg"
  adaptive_icon_background: "#0D1426"
  adaptive_icon_foreground: "assets/icon/app_icon.jpg"
  min_sdk_android: 21
  remove_alpha_ios: true


flutter:

  uses-material-design: true

